services:
  yusaopeny_ymca360.y360_client:
    class: Drupal\yusaopeny_ymca360\Y360Client
    arguments:
      - '@http_client'
      - '@yusaopeny_ymca360.data_wrapper'
      - '@config.factory'
      - '@logger.channel.yusaopeny_ymca360_syncer'

  yusaopeny_ymca360.mapping_repository:
    class: Drupal\yusaopeny_ymca360\Y360MappingRepository
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@logger.channel.yusaopeny_ymca360_syncer'

  yusaopeny_ymca360.data_wrapper:
    class: Drupal\yusaopeny_ymca360\syncer\DataWrapper

  # Abstract parents for submodule syncers (instudio, livestreams). The base
  # classes are abstract; only concrete subclasses are usable services.
  yusaopeny_ymca360.extractor:
    abstract: true
    arguments:
      - '@config.factory'
      - '@yusaopeny_ymca360.y360_client'
      - '@yusaopeny_ymca360.data_wrapper'
      - '@logger.channel.yusaopeny_ymca360_syncer'
      - '@keyvalue'

  yusaopeny_ymca360.transformer:
    abstract: true
    arguments:
      - '@yusaopeny_ymca360.data_wrapper'
      - '@yusaopeny_ymca360.mapping_repository'
      - '@logger.channel.yusaopeny_ymca360_syncer'
      - '@entity.memory_cache'

  yusaopeny_ymca360.loader:
    abstract: true
    arguments:
      - '@yusaopeny_ymca360.data_wrapper'
      - '@yusaopeny_ymca360.mapping_repository'
      - '@entity_type.manager'
      - '@logger.channel.yusaopeny_ymca360_syncer'
      - '@state'
      - '@config.factory'
      - '@module_handler'

  logger.channel.yusaopeny_ymca360_syncer:
    parent: logger.channel_base
    arguments: ['yusaopeny_ymca360_syncer']
